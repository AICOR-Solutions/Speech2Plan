[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech2plan"
version = "0.0.1"
description = "Turns spoken instructions into symbolic tasks grounded in a semantic digital twin."
requires-python = ">=3.12,<3.13"
authors = [{ name = "AICOR Solutions" }]
dependencies = [
  "semantic_digital_twin",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0,<8.0.0"]
ros = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech2plan = ["settings.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
